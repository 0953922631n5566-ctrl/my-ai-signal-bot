<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI AUTO SCANNER PRO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #060a12; color: #ffffff; padding: 16px; display: flex; flex-direction: column; gap: 14px; height: 100vh; justify-content: center; }
    
    .header { text-align: center; padding: 6px; font-weight: 900; font-size: 18px; color: #38bdf8; display: flex; align-items: center; justify-content: center; gap: 8px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    
    .status-badge { font-size: 10px; padding: 3px 10px; border-radius: 12px; font-weight: 900; }
    .status-online { background: #059669; color: #ffffff; border: 1px solid #34d399; box-shadow: 0 0 8px rgba(52, 211, 153, 0.8); animation: pulse 1.2s infinite; }
    .status-offline { background: #dc2626; color: #ffffff; border: 1px solid #fca5a5; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    .scanner-banner { background: #0f172a; border-radius: 12px; padding: 10px; text-align: center; border: 1px solid #0284c7; color: #38bdf8; font-weight: bold; font-size: 12px; box-shadow: 0 0 12px rgba(2, 132, 199, 0.3); }

    .signal-card { background: #0f172a; border-radius: 16px; padding: 20px; text-align: center; border: 1px solid #1e293b; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7); }
    .pair-title { font-size: 15px; color: #facc15; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
    
    .signal-box { 
      font-size: 40px; 
      font-weight: 900; 
      padding: 20px; 
      border-radius: 14px; 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      transition: all 0.2s ease-in-out; 
    }
    
    .WAIT { background: #1e293b; color: #94a3b8; border: 2px solid #334155; }
    .CALL { background: #047857; color: #ffffff; border: 3px solid #10b981; box-shadow: 0 0 35px rgba(16, 185, 129, 0.9); }
    .PUT { background: #be123c; color: #ffffff; border: 3px solid #f43f5e; box-shadow: 0 0 35px rgba(244, 63, 94, 0.9); }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-box { background: #060a12; border-radius: 10px; padding: 10px; text-align: center; border: 1px solid #1e293b; }
    .stat-label { font-size: 10px; color: #64748b; font-weight: 700; }
    .stat-value { font-size: 16px; font-weight: 900; margin-top: 4px; color: #ffffff; }
  </style>
</head>
<body>

  <div class="header">
    ⚡ AI AUTO SCANNER <span id="netStatus" class="status-badge status-offline">● OFFLINE</span>
  </div>

  <div class="scanner-banner">
    🔍 ระบบกำลังสแกนหาคู่เงินที่มีความแม่นยำสูง (≥ 68%) อัตโนมัติ...
  </div>

  <div class="signal-card">
    <div class="pair-title">
      <span>AI Selected: <strong id="marketLabel" style="color: #ffffff;">SCANNING...</strong></span>
      <span id="trendLabel" style="color: #38bdf8; font-size: 11px;">READY ⚡</span>
    </div>

    <div id="signalDisplay" class="signal-box WAIT">WAIT</div>
    
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Confidence</div>
        <div class="stat-value" id="confValue" style="color: #38bdf8;">0.0%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">RSI (14)</div>
        <div class="stat-value" id="rsiValue" style="color: #facc15;">50.0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">แท่งถัดไปใน</div>
        <div class="stat-value" id="timerValue" style="color: #38bdf8;">00s</div>
      </div>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq = 800, duration = 0.25) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { console.log(e); }
    }

    let ws;
    let lastSignalState = 'WAIT';
    let warned10s = false;

    function setNetStatus(isOnline) {
      const badge = document.getElementById('netStatus');
      if (isOnline) {
        badge.innerText = '● LIVE';
        badge.className = 'status-badge status-online';
      } else {
        badge.innerText = '● DISCONNECTED';
        badge.className = 'status-badge status-offline';
      }
    }

    function connectWS() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}`);

      ws.onopen = () => setNetStatus(true);

      ws.onmessage = (event) => {
        setNetStatus(true);
        const data = JSON.parse(event.data);
        if (data.type === 'market_update') {
          const timeLeft = data.timeLeft;

          if (timeLeft === 10 && !warned10s) {
            playBeep(550, 0.15);
            warned10s = true;
          }
          if (timeLeft > 10) warned10s = false;

          if (data.signal !== 'WAIT' && lastSignalState === 'WAIT') {
            playBeep(850, 0.3);
          }
          lastSignalState = data.signal;

          document.getElementById('marketLabel').innerText = data.symbol;
          document.getElementById('signalDisplay').innerText = data.signal;
          document.getElementById('signalDisplay').className = `signal-box ${data.signal}`;
          document.getElementById('confValue').innerText = `${data.confidence}%`;
          document.getElementById('rsiValue').innerText = data.rsi;
          document.getElementById('trendLabel').innerText = data.trend;
          document.getElementById('timerValue').innerText = `${timeLeft}s`;
        }
      };

      ws.onclose = () => {
        setNetStatus(false);
        setTimeout(connectWS, 2000);
      };

      ws.onerror = () => setNetStatus(false);
    }

    window.addEventListener('online', () => setNetStatus(true));
    window.addEventListener('offline', () => setNetStatus(false));

    connectWS();
  </script>
</body>
</html>
