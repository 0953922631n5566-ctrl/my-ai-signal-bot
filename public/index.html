
<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const tg = window.Telegram?.WebApp;

  tg?.ready();
  tg?.expand();

  const POLL_MS = 900000; // 15 นาที เพื่อควบคุมการใช้ API ฟรี
  const SIGNAL_DISPLAY_MS = 40000;
  const MAX_DATA_AGE_MS = 240000;

  let socket = null;
  let reconnectTimer = null;
  let autoTimer = null;
  let countdownTimer = null;
  let autoScan = false;
  let soundOn = false;
  let audio = null;
  let latestState = null;
  let pairs = [];
  let currentSignal = null;
  let signalUntil = 0;
  let lastSignalKey = "";
  let lastBeepSecond = -1;
  let scanPending = false;

  const pairSelect = $("pair");

  function beep(freq = 800, duration = 120) {
    if (!soundOn) return;

    try {
      audio ||= new (
        window.AudioContext || window.webkitAudioContext
      )();

      if (audio.state === "suspended") audio.resume();

      const osc = audio.createOscillator();
      const gain = audio.createGain();

      osc.frequency.value = freq;
      gain.gain.value = 0.06;

      osc.connect(gain);
      gain.connect(audio.destination);

      osc.start();
      osc.stop(audio.currentTime + duration / 1000);
    } catch (error) {
      console.warn("Audio unavailable", error);
    }
  }

  function setConnection(connected) {
    $("dot").className = "dot " + (connected ? "on" : "off");
    $("status").textContent = connected
      ? "เชื่อมต่อแล้ว"
      : "กำลังเชื่อมต่อใหม่";

    $("server").textContent = connected ? "ออนไลน์" : "ออฟไลน์";
    $("banner").classList.toggle("show", !connected);
  }

  function send(message) {
    if (!socket || socket.readyState !== WebSocket.OPEN) {
      $("reason").textContent = "ยังไม่ได้เชื่อมต่อเซิร์ฟเวอร์";
      return false;
    }

    socket.send(JSON.stringify(message));
    return true;
  }

  function selectedPair() {
    return pairs.find(p => p.symbol === pairSelect.value) || null;
  }

  function isFresh(pair) {
    if (!pair) return false;

    const candleTime = Date.parse(pair.candleTime || "");
    const updatedTime = Date.parse(pair.updatedAt || "");

    // ตรวจเวลาของแท่งเทียน ไม่ใช้เวลาที่เพิ่งรับข้อความ
    if (!Number.isFinite(candleTime)) return false;

    const age = Date.now() - candleTime;

    return age >= -60000 &&
      age <= MAX_DATA_AGE_MS &&
      pair.dataStatus === "LIVE_REFERENCE" &&
      Number.isFinite(Number(pair.price));
  }

  function resetSignalDisplay(message = "รอสัญญาณที่ยืนยันได้") {
    currentSignal = null;
    signalUntil = 0;

    $("signal").textContent = "STANDBY";
    $("signal").className = "signal STANDBY";
    $("reason").textContent = message;
  }

  function showSignal(signal, pair, force = false) {
    const validSignals = ["CALL", "PUT", "STANDBY"];
    const value = validSignals.includes(signal) ? signal : "STANDBY";

    if (value === "STANDBY") {
      resetSignalDisplay(pair?.reason || "ยังไม่มีสัญญาณ");
      return;
    }

    const key = `${pair.symbol}:${pair.candleTime}:${value}`;

    // ไม่ส่งเสียงซ้ำจากข้อมูลเดิม
    if (key !== lastSignalKey) {
      lastSignalKey = key;
      beep(value === "CALL" ? 1000 : 450, 220);
    }

    currentSignal = {
      signal: value,
      symbol: pair.symbol,
      candleTime: pair.candleTime
    };

    signalUntil = Date.now() + SIGNAL_DISPLAY_MS;

    $("signal").textContent = value;
    $("signal").className = "signal " + value;
    $("lastSignal").textContent = value;
    $("reason").textContent = pair.reason || "ได้รับสัญญาณจากเซิร์ฟเวอร์";
  }

  function render() {
    const pair = selectedPair();

    if (!pair) {
      resetSignalDisplay("รอข้อมูลคู่เงิน");
      return;
    }

    const fresh = isFresh(pair);

    if (pair.price != null && Number.isFinite(Number(pair.price))) {
      const symbol = pair.symbol || "";
      const decimals = symbol.includes("JPY") ? 3 : 5;

      $("price").textContent = Number(pair.price).toFixed(decimals);
    } else {
      $("price").textContent = "—";
    }

    $("pairName").textContent =
      `${pair.symbol} · ${fresh ? "ข้อมูลพร้อมใช้" : "ข้อมูลเก่าหรือยังไม่พร้อม"}`;

    const indicators = pair.indicators || {};

    $("rsi").textContent = Number.isFinite(Number(indicators.rsi14))
      ? Number(indicators.rsi14).toFixed(2)
      : "—";

    const score = Number(pair.score || 0);
    $("score").textContent = `${score} / 100`;
    $("fill").style.width = `${Math.max(0, Math.min(100, score))}%`;

    $("updated").textContent = pair.updatedAt
      ? new Date(pair.updatedAt).toLocaleTimeString("th-TH")
      : "รอการสแกน";

    $("history").textContent =
      `ล่าสุด: ${pair.symbol} · ${pair.signal || "STANDBY"} · คะแนน ${score}`;

    if (!fresh) {
      resetSignalDisplay(
        pair.reason || "ข้อมูลแท่งเทียนเก่า กรุณารอสแกนใหม่"
      );
      return;
    }

    if (currentSignal && Date.now() < signalUntil &&
        currentSignal.symbol === pair.symbol &&
        currentSignal.candleTime === pair.candleTime) {
      $("signal").textContent = currentSignal.signal;
      $("signal").className = "signal " + currentSignal.signal;
      return;
    }

    // แสดงสัญญาณที่คำนวณได้จริงจาก server
    if (pair.signal === "CALL" || pair.signal === "PUT") {
      showSignal(pair.signal, pair);
    } else {
      resetSignalDisplay(pair.reason || "รอสัญญาณที่ยืนยันได้");
    }
  }

  function handleState(msg) {
    latestState = msg;

    if (Array.isArray(msg.pairs)) {
      pairs = msg.pairs;
    }

    if (msg.state && msg.state.symbol) {
      const current = msg.state;
      const index = pairs.findIndex(p => p.symbol === current.symbol);

      if (index >= 0) pairs[index] = { ...pairs[index], ...current };
      else pairs.push(current);
    }

    $("quota").textContent = msg.configured
      ? "API เชื่อมต่อแล้ว"
      : "ตั้งค่า API Key";

    if (msg.lastError) {
      $("reason").textContent = msg.lastError;
    }

    render();
  }

  function handlePairUpdate(pair) {
    if (!pair || !pair.symbol) return;

    const index = pairs.findIndex(p => p.symbol === pair.symbol);

    if (index >= 0) pairs[index] = { ...pairs[index], ...pair };
    else pairs.push(pair);

    render();
  }

  function connect() {
    if (socket && (
      socket.readyState === WebSocket.OPEN ||
      socket.readyState === WebSocket.CONNECTING
    )) return;

    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    socket = new WebSocket(`${protocol}//${location.host}`);

    socket.onopen = () => {
      setConnection(true);
      send({ action: "get_state" });
    };

    socket.onmessage = event => {
      let msg;

      try {
        msg = JSON.parse(event.data);
      } catch {
        return;
      }

      switch (msg.type) {
        case "state":
          handleState(msg);
          break;

        case "pair_update":
          handlePairUpdate(msg.pair);
          break;

        case "scan_status":
          scanPending = Boolean(msg.scanning);
          $("scan").disabled = scanPending;
          $("scan").textContent = scanPending
            ? "กำลังสแกน..."
            : "⚡ สแกนทันที";
          break;

        case "scan_complete":
          scanPending = false;
          $("scan").disabled = false;
          $("scan").textContent = "⚡ สแกนทันที";

          if (Array.isArray(msg.pairs)) pairs = msg.pairs;
          render();
          break;

        case "scan_result":
          scanPending = false;
          $("scan").disabled = false;
          $("scan").textContent = "⚡ สแกนทันที";

          if (msg.ok === false) {
            $("reason").textContent = msg.message || msg.error ||
              "สแกนไม่สำเร็จ";
          }
          break;

        case "error":
          $("reason").textContent = msg.error || "เกิดข้อผิดพลาด";
          break;

        default:
          // Ignore unknown message types.
          break;
      }
    };

    socket.onclose = () => {
      setConnection(false);
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 3000);
    };

    socket.onerror = () => setConnection(false);
  }

  async function scanSelected() {
    if (scanPending) {
      $("reason").textContent = "กำลังสแกนอยู่ กรุณารอสักครู่";
      return;
    }

    const pair = selectedPair();

    if (!pairSelect.value) {
      $("reason").textContent = "กรุณาเลือกคู่เงิน";
      return;
    }

    $("reason").textContent =
      `กำลังขอข้อมูลตลาดสำหรับ ${pairSelect.value}...`;

    // The current server scans all seven pairs with this action.
    const sent = send({
      action: "manual_scan",
      symbol: pairSelect.value
    });

    if (sent) {
      scanPending = true;
      $("scan").disabled = true;
      $("scan").textContent = "กำลังสแกน...";
    }
  }

  $("sound").onclick = async () => {
    soundOn = !soundOn;
    $("sound").textContent = soundOn ? "🔊 เปิดเสียง" : "🔇 ปิดเสียง";

    if (soundOn) {
      try {
        audio ||= new (
          window.AudioContext || window.webkitAudioContext
        )();
        await audio.resume();
        beep(800, 80);
      } catch {}
    }
  };

  $("scan").onclick = scanSelected;

  $("auto").onclick = () => {
    autoScan = !autoScan;

    $("auto").textContent = autoScan ? "■ ปิดออโต้" : "▶ เปิดออโต้";
    $("auto").classList.toggle("active", autoScan);
    $("scanStatus").textContent = autoScan
      ? "สแกนอัตโนมัติทุก 15 นาที"
      : "ปิดสแกนออโต้";

    clearInterval(autoTimer);

    if (autoScan) {
      scanSelected();
      autoTimer = setInterval(() => {
        if (document.visibilityState === "visible") scanSelected();
      }, POLL_MS);
    }
  };

  $("stop").onclick = () => {
    autoScan = false;
    clearInterval(autoTimer);

    $("auto").textContent = "▶ เปิดออโต้";
    $("auto").classList.remove("active");
    $("scanStatus").textContent = "หยุดสแกนแล้ว";
    $("scan").disabled = false;
    $("scan").textContent = "⚡ สแกนทันที";

    resetSignalDisplay("หยุดสแกนอัตโนมัติแล้ว");
  };

  $("reset").onclick = () => {
    resetSignalDisplay("รีเซ็ตหน้าจอแล้ว รอสัญญาณจากเซิร์ฟเวอร์");
    render();
  };

  pairSelect.onchange = () => {
    currentSignal = null;
    signalUntil = 0;

    send({
      action: "set_symbol",
      symbol: pairSelect.value
    });

    render();
  };

  function tick() {
    const now = Date.now();
    const remaining = 60 - Math.floor((now / 1000) % 60);

    $("countdown").textContent = `${remaining} วินาที`;

    if (remaining !== lastBeepSecond) {
      lastBeepSecond = remaining;

      if (remaining === 10) beep(700, 100);
      if (remaining <= 2) beep(1100, 130);
    }

    if (currentSignal && now >= signalUntil) {
      currentSignal = null;
      signalUntil = 0;
      render();
    }

    // Do not leave a stale signal displayed when the data expires.
    const pair = selectedPair();
    if (pair && !isFresh(pair)) {
      resetSignalDisplay("ข้อมูลเก่า รอสแกนใหม่");
    }
  }

  connect();

  countdownTimer = setInterval(tick, 500);

  // Refresh status after a reconnect or page return.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      if (!socket || socket.readyState !== WebSocket.OPEN) connect();
      else send({ action: "get_state" });
    }
  });
})();
</script>
