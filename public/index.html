<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI AUTO SCANNER PRO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #060a12; color: #ffffff; padding: 12px; display: flex; flex-direction: column; gap: 10px; height: 100vh; overflow: hidden; }
    .header { text-align: center; padding: 4px; font-weight: 900; font-size: 16px; color: #38bdf8; display: flex; align-items: center; justify-content: center; gap: 8px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    .scanner-banner { background: #0f172a; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #1e293b; }
    .pair-selector { background: #1e293b; border: 1px solid #334155; color: #ffffff; padding: 8px 12px; border-radius: 8px; width: 100%; text-align: center; font-size: 13px; font-weight: bold; cursor: pointer; }
    .info-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: bold; }
    .badge-active { background: #059669; color: #ffffff; padding: 2px 8px; border-radius: 6px; font-size: 10px; border: 1px solid #34d399; }
    
    /* ปุ่มสลับ Timeframe */
    .tf-container { display: flex; justify-content: center; gap: 10px; margin: 2px 0; }
    .tf-btn { flex: 1; padding: 8px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; font-size: 13px; transition: 0.2s; }
    .tf-btn.active { background: #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }
    .tf-btn.inactive { background: #334155; color: #94a3b8; }

    .signal-card { flex: 1; background: #0f172a; border-radius: 16px; border: 2px solid #1e293b; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; text-align: center; }
    
    @keyframes pulseAnim {
      0% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.04); opacity: 1; text-shadow: 0 0 25px currentColor; }
      100% { transform: scale(1); opacity: 0.95; }
    }

    .signal-text { font-size: 38px; font-weight: 900; letter-spacing: 2px; margin: 10px 0; animation: pulseAnim 0.8s infinite alternate; }
    .signal-wait { color: #94a3b8; animation: none; }
    .signal-call { color: #22c55e; }
    .signal-put { color: #ef4444; }
    .signal-sideway { color: #f59e0b; animation: none; }

    .footer-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .metric-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; text-align: center; }
    .metric-label { font-size: 10px; color: #94a3b8; margin-bottom: 4px; }
    .metric-value { font-size: 15px; font-weight: bold; color: #f8fafc; }
  </style>
</head>
<body>

  <div class="header">
    ⚡ Noghjklbot <span class="badge-active">LIVE</span>
  </div>

  <!-- ปุ่มสลับโหมด Timeframe -->
  <div class="tf-container">
    <button id="btn1m" class="tf-btn active" onclick="switchTF('1m')">⏱️ 1 นาที</button>
    <button id="btn5m" class="tf-btn inactive" onclick="switchTF('5m')">⏱️ 5 นาที</button>
  </div>

  <div class="scanner-banner">
    <select id="pairSelect" class="pair-selector" onchange="changePair()">
      <!-- ตัวเลือกคู่เงินพร้อมสถานะ -->
    </select>
    <div class="info-row">
      <span id="selectedPairName">AI Selected: EUR/USD</span>
      <span id="marketStatusBadge" style="color: #22c55e;">SAFE 🟢</span>
    </div>
  </div>

  <div class="signal-card" id="signalCard">
    <div style="font-size: 11px; color: #64748b; position: absolute; top: 12px; left: 16px;" id="trendLabel">TREND: READY 🟢</div>
    <div class="signal-text signal-wait" id="signalDisplay">WAIT</div>
  </div>

  <div class="footer-metrics">
    <div class="metric-box">
      <div class="metric-label">Confidence</div>
      <div class="metric-value" id="confDisplay">0.0%</div>
    </div>
    <div class="metric-box">
      <div class="metric-label">RSI (14)</div>
      <div class="metric-value" id="rsiDisplay">50.0</div>
    </div>
    <div class="metric-box">
      <div class="metric-label" id="timerLabel">แท่งถัดไปใน</div>
      <div class="metric-value" id="timeDisplay">--s</div>
    </div>
  </div>

  <script>
    let ws;
    let currentPairKey = 'eurusd';
    let currentTF = '1m';
    let latestData = null;
    let lastSignalState = 'WAIT';
    let lastTimeLeft = 60;

    const symbolsList = [
      { key: 'eurusd', name: 'EUR/USD' },
      { key: 'gbpusdt', name: 'GBP/USD' },
      { key: 'usdjpy', name: 'USD/JPY' },
      { key: 'audusd', name: 'AUD/USD' },
      { key: 'nzdusd', name: 'NZD/USD' },
      { key: 'usdcad', name: 'USD/CAD' },
      { key: 'eurjpy', name: 'EUR/JPY' },
      { key: 'gbpjpy', name: 'GBP/JPY' },
      { key: 'eurgbp', name: 'EUR/GBP' },
      { key: 'audjpy', name: 'AUD/JPY' }
    ];

    // 🔊 เสียงเตือนเตรียมตัว (ตอนเหลือ 10 วินาทีสุดท้าย ให้เฝ้าหน้าจอ)
    function playWarningAlarm() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.setValueAtTime(500, audioCtx.currentTime + 0.1);
        
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (e) {}
    }

    // 🔊 เสียงสัญญาณจริง (CALL / PUT)
    function playSignalSound(type) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'CALL') {
          osc.frequency.setValueAtTime(500, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
        } else {
          osc.frequency.setValueAtTime(700, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.2);
        }
        
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    // อัปเดตรายการคู่เงินในดรอปดาวน์ พร้อมแสดงสถานะ (ปลอดภัย/อันตราย)
    function updatePairSelectOptions(pairsData) {
      const select = document.getElementById('pairSelect');
      const currentSelected = select.value || currentPairKey;
      
      select.innerHTML = '';
      symbolsList.forEach(s => {
        const pInfo = pairsData ? pairsData.find(p => p.key === s.key) : null;
        let statusIcon = '🟢';
        let statusText = 'SAFE';
        
        if (pInfo) {
          statusIcon = pInfo.statusText === 'DANGER' ? '🔴' : '🟢';
          statusText = pInfo.statusText;
        }

        const opt = document.createElement('option');
        opt.value = s.key;
        opt.textContent = `${statusIcon} ${s.name} [${statusText}]`;
        if (s.key === currentSelected) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function changePair() {
      const select = document.getElementById('pairSelect');
      currentPairKey = select.value;
      lastSignalState = 'WAIT';
      updateUI();
    }

    function switchTF(tf) {
      currentTF = tf;
      document.getElementById('btn1m').className = tf === '1m' ? 'tf-btn active' : 'tf-btn inactive';
      document.getElementById('btn5m').className = tf === '5m' ? 'tf-btn active' : 'tf-btn inactive';
      lastSignalState = 'WAIT';
      
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: 'change_tf', tf: tf }));
      }
    }

    function connectWS() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ action: 'change_tf', tf: currentTF }));
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'scanner_update') {
            latestData = data;
            updateUI();
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        setTimeout(connectWS, 2000);
      };
    }

    function updateUI() {
      if (!latestData) return;

      const timeLeft = latestData.timeLeft;
      document.getElementById('timeDisplay').innerText = timeLeft + 's';

      // 🔔 แจ้งเตือนล่วงหน้าตอนเหลือ 10 วินาทีสุดท้าย ให้เฝ้าหน้าจอ
      if (timeLeft === 10 && lastTimeLeft !== 10) {
        playWarningAlarm();
      }
      lastTimeLeft = timeLeft;

      // อัปเดตสถานะดรอปดาวน์คู่เงิน
      updatePairSelectOptions(latestData.pairs);

      const pair = latestData.pairs.find(p => p.key === currentPairKey) || latestData.pairs[0];
      if (!pair) return;

      document.getElementById('selectedPairName').innerText = `AI Selected: ${pair.name}`;
      document.getElementById('trendLabel').innerText = `TREND: ${pair.trend}`;
      
      const badge = document.getElementById('marketStatusBadge');
      badge.innerText = `${pair.statusText} ${pair.statusText === 'DANGER' ? '🔴' : '🟢'}`;
      badge.style.color = pair.statusText === 'DANGER' ? '#ef4444' : '#22c55e';

      const sigDisplay = document.getElementById('signalDisplay');
      sigDisplay.className = 'signal-text';

      if (pair.signal === 'CALL') {
        sigDisplay.innerHTML = '▲ CALL ▲';
        sigDisplay.classList.add('signal-call');
        if (lastSignalState !== 'CALL') {
          playSignalSound('CALL');
          lastSignalState = 'CALL';
        }
      } else if (pair.signal === 'PUT') {
        sigDisplay.innerHTML = '▼ PUT ▼';
        sigDisplay.classList.add('signal-put');
        if (lastSignalState !== 'PUT') {
          playSignalSound('PUT');
          lastSignalState = 'PUT';
        }
      } else if (pair.signal === 'SIDEWAY') {
        sigDisplay.innerHTML = 'SIDEWAY';
        sigDisplay.classList.add('signal-sideway');
        lastSignalState = 'SIDEWAY';
      } else {
        sigDisplay.innerHTML = 'WAIT';
        sigDisplay.classList.add('signal-wait');
        lastSignalState = 'WAIT';
      }

      document.getElementById('confDisplay').innerText = pair.confidence + '%';
      document.getElementById('rsiDisplay').innerText = pair.rsi;
    }

    window.onload = () => {
      updatePairSelectOptions(null);
      connectWS();
    };
  </script>
</body>
</html>
