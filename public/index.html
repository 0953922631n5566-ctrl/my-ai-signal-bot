<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI Trading Assistant</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 16px; display: flex; flex-direction: column; gap: 14px; height: 100vh; justify-content: center; }
    
    .header { text-align: center; padding: 8px; font-weight: bold; font-size: 18px; color: #38bdf8; display: flex; align-items: center; justify-content: center; gap: 6px; }
    
    /* สไตล์ป้าย LIVE และการกระพริบ */
    .status-badge { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: bold; transition: all 0.3s ease; }
    .status-online { background: #064e3b; color: #34d399; border: 1px solid #059669; animation: pulse 1.5s infinite; }
    .status-offline { background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Controls Section */
    .controls-card { background: #1e293b; border-radius: 14px; padding: 12px; display: flex; gap: 10px; border: 1px solid #334155; }
    .select-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .select-group label { font-size: 11px; color: #94a3b8; }
    select { background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 10px; border-radius: 8px; font-size: 14px; outline: none; font-weight: bold; }

    /* Signal Card */
    .signal-card { background: #1e293b; border-radius: 14px; padding: 20px; text-align: center; border: 1px solid #334155; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
    .pair-title { font-size: 14px; color: #94a3b8; font-weight: 500; }
    .signal-box { font-size: 38px; font-weight: 900; padding: 18px; border-radius: 12px; text-transform: uppercase; letter-spacing: 2px; transition: background-color 0.2s; }
    
    /* ไฟสแตนบายสีส้ม (WAIT) */
    .WAIT { background: #7c2d12; color: #fb923c; border: 2px solid #f97316; box-shadow: 0 0 12px rgba(249, 115, 22, 0.3); }
    .CALL { background: #065f46; color: #34d399; border: 2px solid #10b981; text-shadow: 0 0 10px rgba(16, 185, 129, 0.4); box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
    .PUT { background: #831843; color: #f43f5e; border: 2px solid #f43f5e; text-shadow: 0 0 10px rgba(244, 63, 94, 0.4); box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }

    /* Indicators Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-box { background: #0f172a; border-radius: 10px; padding: 10px; text-align: center; border: 1px solid #334155; }
    .stat-label { font-size: 11px; color: #94a3b8; }
    .stat-value { font-size: 16px; font-weight: bold; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="header">
    🤖 AI Signal Assistant <span id="netStatus" class="status-badge status-offline">● OFFLINE</span>
  </div>

  <div class="controls-card">
    <div class="select-group">
      <label>คู่เงิน (IQ Option)</label>
      <select id="assetSelect" onchange="changeMarket()">
        <option value="EURUSD">EUR/USD</option>
        <option value="GBPUSD">GBP/USD</option>
        <option value="USDJPY">USD/JPY</option>
        <option value="AUDUSD">AUD/USD</option>
        <option value="BTCUSD">BTC/USD (Crypto)</option>
      </select>
    </div>
    <div class="select-group">
      <label>กรอบเวลา (Timeframe)</label>
      <select id="tfSelect" onchange="changeMarket()">
        <option value="1m">1 นาที (1M)</option>
        <option value="5m">5 นาที (5M)</option>
      </select>
    </div>
  </div>

  <div class="signal-card">
    <div class="pair-title" id="marketLabel">EUR/USD (1M)</div>
    <div id="signalDisplay" class="signal-box WAIT">WAIT</div>
    
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Confidence</div>
        <div class="stat-value" id="confValue">0.0%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">RSI (14)</div>
        <div class="stat-value" id="rsiValue">50.0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">แท่งถัดไปใน</div>
        <div class="stat-value" id="timerValue" style="color: #38bdf8;">00s</div>
      </div>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    // สร้างระบบเสียงสังเคราะห์ (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq = 600, duration = 0.15) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { console.log(e); }
    }

    let ws;
    let playedSound3 = false;
    let playedSound2 = false;

    function setNetStatus(isOnline) {
      const badge = document.getElementById('netStatus');
      if (isOnline) {
        badge.innerText = '● LIVE';
        badge.className = 'status-badge status-online';
      } else {
        badge.innerText = '● DISCONNECTED';
        badge.className = 'status-badge status-offline';
      }
    }

    function connectWS() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}`);

      ws.onopen = () => setNetStatus(true);

      ws.onmessage = (event) => {
        setNetStatus(true);
        const data = JSON.parse(event.data);
        if (data.type === 'market_update') {
          const timeLeft = data.timeLeft;

          // ส่งเสียงเตือนตอน 3 วินาที และ 2 วินาทีสุดท้าย
          if (timeLeft === 3 && !playedSound3) {
            playBeep(500, 0.1); // เสียงเตรียมตัว ครั้งที่ 1
            playedSound3 = true;
          }
          if (timeLeft === 2 && !playedSound2) {
            playBeep(800, 0.15); // เสียงเตรียมตัว ครั้งที่ 2
            playedSound2 = true;
          }
          if (timeLeft > 3) {
            playedSound3 = false;
            playedSound2 = false;
          }

          document.getElementById('signalDisplay').innerText = data.signal;
          document.getElementById('signalDisplay').className = `signal-box ${data.signal}`;
          document.getElementById('confValue').innerText = `${data.confidence}%`;
          document.getElementById('rsiValue').innerText = data.rsi;
          document.getElementById('timerValue').innerText = `${timeLeft}s`;
        }
      };

      ws.onclose = () => {
        setNetStatus(false);
        setTimeout(connectWS, 2000);
      };

      ws.onerror = () => setNetStatus(false);
    }

    function changeMarket() {
      const symbol = document.getElementById('assetSelect').value;
      const tf = document.getElementById('tfSelect').value;
      document.getElementById('marketLabel').innerText = `${symbol} (${tf.toUpperCase()})`;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'subscribe', symbol, tf }));
      }
    }

    // เช็คสถานะอินเทอร์เน็ตของเครื่องมือถือ
    window.addEventListener('online', () => setNetStatus(true));
    window.addEventListener('offline', () => setNetStatus(false));

    connectWS();
  </script>
</body>
</html>
