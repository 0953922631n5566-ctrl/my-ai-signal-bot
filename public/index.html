<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI Signal Assistant - Dual Engine Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #080d1a; color: #ffffff; padding: 14px; display: flex; flex-direction: column; gap: 12px; height: 100vh; justify-content: center; position: relative; }
    
    .header { text-align: center; padding: 6px; font-weight: 800; font-size: 18px; color: #38bdf8; display: flex; align-items: center; justify-content: center; gap: 8px; }
    
    .status-badge { font-size: 11px; padding: 4px 10px; border-radius: 12px; font-weight: 900; }
    .status-online { background: #059669; color: #ffffff; border: 1px solid #34d399; box-shadow: 0 0 8px rgba(52, 211, 153, 0.8); }
    .status-offline { background: #dc2626; color: #ffffff; border: 1px solid #fca5a5; box-shadow: 0 0 8px rgba(220, 38, 38, 0.8); }

    .controls-card { background: #111a2e; border-radius: 14px; padding: 10px; display: flex; gap: 8px; border: 1px solid #2a3a5c; }
    .select-group { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .select-group label { font-size: 10px; color: #38bdf8; font-weight: bold; }
    select { background: #080d1a; color: #ffffff; border: 1.5px solid #38bdf8; padding: 8px; border-radius: 8px; font-size: 13px; outline: none; font-weight: bold; }

    /* Action Bar Mode Selector */
    .action-bar { display: flex; gap: 8px; }
    .btn-mode { flex: 1; background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .btn-mode.active-auto { background: #0369a1; color: #ffffff; border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    .btn-mode.active-vision { background: #d97706; color: #ffffff; border-color: #fbbf24; box-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }

    .signal-card { background: #111a2e; border-radius: 16px; padding: 18px; text-align: center; border: 1px solid #2a3a5c; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6); }
    .pair-title { font-size: 14px; color: #cbd5e1; font-weight: 700; }
    
    .signal-box { 
      font-size: 38px; 
      font-weight: 900; 
      padding: 18px; 
      border-radius: 14px; 
      text-transform: uppercase; 
      letter-spacing: 3px; 
      transition: all 0.2s ease-in-out; 
    }
    
    .WAIT { background: #c2410c; color: #ffffff; border: 3px solid #ff781f; box-shadow: 0 0 22px rgba(255, 120, 31, 0.7); text-shadow: 0 0 12px rgba(255, 255, 255, 0.9); }
    .CALL { background: #047857; color: #ffffff; border: 3px solid #10b981; box-shadow: 0 0 25px rgba(16, 185, 129, 0.9); text-shadow: 0 0 12px rgba(255, 255, 255, 0.9); }
    .PUT { background: #be123c; color: #ffffff; border: 3px solid #f43f5e; box-shadow: 0 0 25px rgba(244, 63, 94, 0.9); text-shadow: 0 0 12px rgba(255, 255, 255, 0.9); }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-box { background: #080d1a; border-radius: 10px; padding: 8px; text-align: center; border: 1px solid #1e2d4a; }
    .stat-label { font-size: 10px; color: #94a3b8; font-weight: 600; }
    .stat-value { font-size: 16px; font-weight: 900; margin-top: 3px; color: #ffffff; }

    .btn-action { width: 100%; background: #7c3aed; color: #ffffff; border: 1.5px solid #a855f7; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 0 12px rgba(168, 85, 247, 0.6); }

    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95); color: #38bdf8; border: 1px solid #38bdf8;
      padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: bold;
      transition: transform 0.3s ease; z-index: 1000; pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="header">
    🤖 AI Signal Assistant <span id="netStatus" class="status-badge status-offline">OFFLINE</span>
  </div>

  <div class="controls-card">
    <div class="select-group">
      <label>คู่เงิน (IQ Option)</label>
      <select id="assetSelect" onchange="changeMarket()">
        <option value="EURUSD">EUR/USD</option>
        <option value="GBPUSD">GBP/USD</option>
        <option value="USDJPY">USD/JPY</option>
        <option value="AUDUSD">AUD/USD</option>
        <option value="BTCUSD">BTC/USD (Crypto)</option>
      </select>
    </div>
    <div class="select-group">
      <label>กรอบเวลา (Timeframe)</label>
      <select id="tfSelect" onchange="changeMarket()">
        <option value="1m">1 นาที (1M)</option>
        <option value="5m">5 นาที (5M)</option>
      </select>
    </div>
  </div>

  <div class="action-bar">
    <button id="btnAutoMode" class="btn-mode active-auto" onclick="setMode('AUTO')">🛡️ โหมด: AUTO</button>
    <button id="btnVisionMode" class="btn-mode" onclick="setMode('VISION')">📸 โหมด: VISION AI</button>
  </div>

  <div class="signal-card" id="captureArea">
    <div class="pair-title" id="marketLabel">EUR/USD (1M)</div>
    <div id="signalDisplay" class="signal-box WAIT">WAIT</div>
    
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Confidence</div>
        <div class="stat-value" id="confValue" style="color: #38bdf8;">0.0%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">RSI (14)</div>
        <div class="stat-value" id="rsiValue" style="color: #facc15;">50.0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">แท่งถัดไปใน</div>
        <div class="stat-value" id="timerValue" style="color: #38bdf8;">00s</div>
      </div>
    </div>
  </div>

  <button class="btn-action" onclick="handleAction()">📸 แคปบันทึกรูปหน้างาน</button>

  <div id="toast">ระบบทำงานสำเร็จ</div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let currentMode = 'AUTO';

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function playBeep(freq = 600, duration = 0.15) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { console.log(e); }
    }

    function setMode(mode) {
      currentMode = mode;
      const autoBtn = document.getElementById('btnAutoMode');
      const visionBtn = document.getElementById('btnVisionMode');

      if (mode === 'AUTO') {
        autoBtn.className = 'btn-mode active-auto';
        visionBtn.className = 'btn-mode';
        showToast('🛡️ สลับเป็นโหมด AUTO อัตโนมัติ');
      } else {
        autoBtn.className = 'btn-mode';
        visionBtn.className = 'btn-mode active-vision';
        showToast('📸 สลับเป็นโหมด VISION AI สแกนภาพ');
      }
    }

    function handleAction() {
      showToast('📸 กำลังบันทึกภาพหน้าจอ...');
      const captureElement = document.getElementById('captureArea');
      html2canvas(captureElement, { backgroundColor: '#111a2e' }).then(canvas => {
        const imageURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.href = imageURL;
        link.download = `Trading_Snapshot_${Date.now()}.png`;
        link.click();
        showToast('✅ บันทึกภาพลงมือถือสำเร็จ!');
      });
    }

    let ws;
    let playedSound3 = false;
    let playedSound2 = false;

    function setNetStatus(isOnline) {
      const badge = document.getElementById('netStatus');
      if (isOnline) {
        badge.innerText = 'LIVE';
        badge.className = 'status-badge status-online';
      } else {
        badge.innerText = 'OFFLINE';
        badge.className = 'status-badge status-offline';
      }
    }

    function connectWS() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}`);

      ws.onopen = () => setNetStatus(true);

      ws.onmessage = (event) => {
        setNetStatus(true);
        const data = JSON.parse(event.data);
        if (data.type === 'market_update') {
          const timeLeft = data.timeLeft;

          if (currentMode === 'AUTO') {
            if (timeLeft === 3 && !playedSound3) {
              playBeep(600, 0.12);
              playedSound3 = true;
            }
            if (timeLeft === 2 && !playedSound2) {
              playBeep(900, 0.18);
              playedSound2 = true;
            }
            if (timeLeft > 3) {
              playedSound3 = false;
              playedSound2 = false;
            }

            document.getElementById('signalDisplay').innerText = data.signal;
            document.getElementById('signalDisplay').className = `signal-box ${data.signal}`;
            document.getElementById('confValue').innerText = `${data.confidence}%`;
            document.getElementById('rsiValue').innerText = data.rsi;
          }

          document.getElementById('timerValue').innerText = `${timeLeft}s`;
        }
      };

      ws.onclose = () => {
        setNetStatus(false);
        setTimeout(connectWS, 2000);
      };

      ws.onerror = () => setNetStatus(false);
    }

    function changeMarket() {
      const symbol = document.getElementById('assetSelect').value;
      const tf = document.getElementById('tfSelect').value;
      document.getElementById('marketLabel').innerText = `${symbol} (${tf.toUpperCase()})`;
      showToast(`🔄 เปลี่ยนเป็น ${symbol} (${tf.toUpperCase()})`);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'subscribe', symbol, tf }));
      }
    }

    window.addEventListener('online', () => setNetStatus(true));
    window.addEventListener('offline', () => setNetStatus(false));

    connectWS();
  </script>
</body>
</html>
