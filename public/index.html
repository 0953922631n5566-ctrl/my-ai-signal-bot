<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI TRADING DASHBOARD PRO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #060a12; color: #ffffff; padding: 12px; display: flex; flex-direction: column; gap: 10px; height: 100vh; overflow: hidden; }
    
    .header { text-align: center; padding: 4px; font-weight: 900; font-size: 16px; color: #38bdf8; display: flex; align-items: center; justify-content: center; gap: 8px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    .badge-active { background: #059669; color: #ffffff; padding: 2px 8px; border-radius: 6px; font-size: 10px; border: 1px solid #34d399; }
    
    /* ปุ่มสลับ Timeframe */
    .tf-container { display: flex; gap: 10px; }
    .tf-btn { flex: 1; padding: 8px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; font-size: 13px; transition: 0.2s; }
    .tf-btn.active { background: #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }
    .tf-btn.inactive { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }

    /* แบนเนอร์กดเปิดเมนูเลือกคู่เงิน */
    .scanner-banner { background: #0f172a; border-radius: 12px; padding: 12px; border: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
    .scanner-banner:hover { border-color: #38bdf8; }

    /* หน้าต่างเมนูซ่อนข้างใน (Modal Popup เต็มจอ) */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(6, 10, 18, 0.95); z-index: 100; display: none; flex-direction: column; padding: 16px; }
    .modal-content { background: #0f172a; border-radius: 16px; border: 1px solid #334155; flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 12px; gap: 10px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 15px; color: #38bdf8; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
    .modal-close-btn { background: #ef4444; border: none; color: white; padding: 6px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
    
    /* รายการคู่เงินในเมนู */
    .modal-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; padding-right: 4px; }
    .modal-item { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
    .modal-item.selected { border-color: #38bdf8; background: #0f172a; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
    .modal-item-left { display: flex; flex-direction: column; gap: 2px; }
    .modal-item-name { font-size: 14px; font-weight: bold; color: #fff; }
    .modal-item-rsi { font-size: 11px; color: #94a3b8; }
    .modal-badge-safe { color: #22c55e; font-size: 12px; font-weight: bold; }
    .modal-badge-danger { color: #ef4444; font-size: 12px; font-weight: bold; }

    /* กล่องแสดงสัญญาณหลัก */
    .signal-card { flex: 1; background: #0f172a; border-radius: 16px; border: 2px solid #1e293b; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; text-align: center; transition: 0.3s; }
    
    @keyframes pulseAnim {
      0% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(1); opacity: 0.95; }
    }

    .signal-text { font-size: 42px; font-weight: 900; letter-spacing: 2px; margin: 10px 0; animation: pulseAnim 0.8s infinite alternate; }
    .signal-wait { color: #94a3b8; animation: none; }
    
    /* โหมด CALL (เขียว) */
    .signal-card.call-mode { border-color: #22c55e; background: rgba(34, 197, 94, 0.05); }
    .signal-call { color: #22c55e; text-shadow: 0 0 20px rgba(34, 197, 94, 0.6); }

    /* โหมด PUT (แดงอ่อนในตัวอักษร / แดงเข้มที่ขอบและลูกศร) */
    .signal-card.put-mode { border-color: #991b1b; background: rgba(239, 68, 68, 0.06); }
    .signal-put { color: #fca5a5; text-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
    .arrow-put { color: #b91c1c !important; }

    /* แถบเมตริกด้านล่าง */
    .footer-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .metric-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; text-align: center; }
    .metric-label { font-size: 10px; color: #94a3b8; margin-bottom: 4px; }
    .metric-value { font-size: 15px; font-weight: bold; color: #f8fafc; }
  </style>
</head>
<body>

  <div class="header">
    ⚡ Noghjklbot <span class="badge-active">LIVE</span>
  </div>

  <!-- ปุ่มสลับโหมด Timeframe -->
  <div class="tf-container">
    <button id="btn1m" class="tf-btn active" onclick="switchTF('1m')">⏱️ 1 นาที</button>
    <button id="btn5m" class="tf-btn inactive" onclick="switchTF('5m')">⏱️ 5 นาที</button>
  </div>

  <!-- แบนเนอร์กดเปิดเมนูเลือกคู่เงิน -->
  <div class="scanner-banner" onclick="openPairModal()">
    <div>
      <div style="font-size: 10px; color: #94a3b8; margin-bottom: 2px;">AI Selected Pair</div>
      <div id="selectedPairTitle" style="font-size: 14px; font-weight: bold; color: #38bdf8;">EUR/USD</div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <span id="marketStatusBadge" style="font-size: 12px; font-weight: bold; color: #22c55e;">SAFE 🟢</span>
      <span style="font-size: 12px; color: #94a3b8;">▼ เมนู</span>
    </div>
  </div>

  <!-- หน้าต่างเมนูซ่อนข้างใน (Modal Popup เต็มจอ) -->
  <div class="modal-overlay" id="pairModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>📋 รายการคู่เงินทั้งหมด & สถานะตลาด</span>
        <button class="modal-close-btn" onclick="closePairModal()">ปิด X</button>
      </div>
      <div class="modal-list" id="modalPairList">
        <!-- รายการคู่เงินจะถูกสร้างตรงนี้แบบเรียงยาวเต็มจอ -->
      </div>
    </div>
  </div>

  <!-- กล่องแสดงสัญญาณหลัก -->
  <div class="signal-card" id="signalCard">
    <div style="font-size: 11px; color: #64748b; position: absolute; top: 12px; left: 16px;" id="trendLabel">TREND: READY 🟢</div>
    <div class="signal-text signal-wait" id="signalDisplay">WAIT</div>
  </div>

  <!-- แถบสรุปผลลัพธ์ด้านล่าง -->
  <div class="footer-metrics">
    <div class="metric-box">
      <div class="metric-label">Confidence</div>
      <div class="metric-value" id="confDisplay">0.0%</div>
    </div>
    <div class="metric-box">
      <div class="metric-label">RSI (14)</div>
      <div class="metric-value" id="rsiDisplay">50.0</div>
    </div>
    <div class="metric-box">
      <div class="metric-label" id="timerLabel">แท่งถัดไปใน</div>
      <div class="metric-value" id="timeDisplay">--s</div>
    </div>
  </div>

  <script>
    let ws;
    let currentPairKey = 'eurusd';
    let currentTF = '1m';
    let latestData = null;
    let lastSignalState = 'WAIT';
    let isModalListInitialized = false;

    const symbolsList = [
      { key: 'eurusd', name: 'EUR/USD' },
      { key: 'gbpusdt', name: 'GBP/USD' },
      { key: 'usdjpy', name: 'USD/JPY' },
      { key: 'audusd', name: 'AUD/USD' },
      { key: 'nzdusd', name: 'NZD/USD' },
      { key: 'usdcad', name: 'USD/CAD' },
      { key: 'eurjpy', name: 'EUR/JPY' },
      { key: 'gbpjpy', name: 'GBP/JPY' },
      { key: 'eurgbp', name: 'EUR/GBP' },
      { key: 'audjpy', name: 'AUD/JPY' }
    ];

    // 🔊 เสียงติ๊ดสั้นๆ คล้ายเข็มนาฬิกา
    function playClockTickSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      } catch (e) {}
    }

    function openPairModal() {
      document.getElementById('pairModal').style.display = 'flex';
    }

    function closePairModal() {
      document.getElementById('pairModal').style.display = 'none';
    }

    // สร้างหรืออัปเดตรายการคู่เงินในเมนูแบบไม่กระพริบ
    function updateModalList(pairsData) {
      const listContainer = document.getElementById('modalPairList');

      if (!isModalListInitialized) {
        listContainer.innerHTML = '';
        symbolsList.forEach(s => {
          const item = document.createElement('div');
          item.className = 'modal-item' + (s.key === currentPairKey ? ' selected' : '');
          item.id = 'modal_item_' + s.key;
          item.onclick = () => selectPairFromModal(s.key);
          item.innerHTML = `
            <div class="modal-item-left">
              <span class="modal-item-name">${s.name}</span>
              <span class="modal-item-rsi" id="modal_rsi_${s.key}">RSI: 50.0</span>
            </div>
            <div>
              <span class="modal-badge-safe" id="modal_badge_${s.key}">🟢 SAFE</span>
            </div>
          `;
          listContainer.appendChild(item);
        });
        isModalListInitialized = true;
      }

      // อัปเดตข้อมูลสถานะเรียลไทม์
      symbolsList.forEach(s => {
        const item = document.getElementById('modal_item_' + s.key);
        if (item) {
          if (s.key === currentPairKey) {
            item.classList.add('selected');
          } else {
            item.classList.remove('selected');
          }

          const pInfo = pairsData ? pairsData.find(p => p.key === s.key) : null;
          const badge = document.getElementById('modal_badge_' + s.key);
          const rsiTxt = document.getElementById('modal_rsi_' + s.key);

          if (pInfo) {
            const isDanger = pInfo.statusText === 'DANGER';
            badge.textContent = isDanger ? '🔴 DANGER' : '🟢 SAFE';
            badge.className = isDanger ? 'modal-badge-danger' : 'modal-badge-safe';
            rsiTxt.textContent = `RSI: ${pInfo.rsi} | Trend: ${pInfo.trend}`;
          }
        }
      });
    }

    function selectPairFromModal(key) {
      currentPairKey = key;
      lastSignalState = 'WAIT';
      updateModalList(latestData ? latestData.pairs : null);
      updateUI();
      closePairModal();
    }

    function switchTF(tf) {
      currentTF = tf;
      document.getElementById('btn1m').className = tf === '1m' ? 'tf-btn active' : 'tf-btn inactive';
      document.getElementById('btn5m').className = tf === '5m' ? 'tf-btn active' : 'tf-btn inactive';
      lastSignalState = 'WAIT';
      
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: 'change_tf', tf: tf }));
      }
    }

    function connectWS() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ action: 'change_tf', tf: currentTF }));
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'scanner_update') {
            latestData = data;
            updateModalList(data.pairs);
            updateUI();
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        setTimeout(connectWS, 2000);
      };
    }

    function updateUI() {
      if (!latestData) return;

      document.getElementById('timeDisplay').innerText = latestData.timeLeft + 's';

      const pair = latestData.pairs.find(p => p.key === currentPairKey) || latestData.pairs[0];
      if (!pair) return;

      document.getElementById('selectedPairTitle').innerText = pair.name;
      document.getElementById('trendLabel').innerText = `TREND: ${pair.trend}`;
      
      const badge = document.getElementById('marketStatusBadge');
      badge.innerText = `${pair.statusText} ${pair.statusText === 'DANGER' ? '🔴' : '🟢'}`;
      badge.style.color = pair.statusText === 'DANGER' ? '#ef4444' : '#22c55e';

      const sigDisplay = document.getElementById('signalDisplay');
      const sigCard = document.getElementById('signalCard');
      
      sigDisplay.className = 'signal-text';
      sigCard.className = 'signal-card';

      if (pair.signal === 'CALL') {
        sigDisplay.innerHTML = '<span style="color:#22c55e;">▲</span> CALL <span style="color:#22c55e;">▲</span>';
        sigDisplay.classList.add('signal-call');
        sigCard.classList.add('call-mode');
        if (lastSignalState !== 'CALL') {
          playClockTickSound();
          lastSignalState = 'CALL';
        }
      } else if (pair.signal === 'PUT') {
        sigDisplay.innerHTML = '<span class="arrow-put">▼</span> PUT <span class="arrow-put">▼</span>';
        sigDisplay.classList.add('signal-put');
        sigCard.classList.add('put-mode');
        if (lastSignalState !== 'PUT') {
          playClockTickSound();
          lastSignalState = 'PUT';
        }
      } else if (pair.signal === 'SIDEWAY') {
        sigDisplay.innerHTML = 'SIDEWAY';
        sigDisplay.classList.add('signal-sideway');
        lastSignalState = 'SIDEWAY';
      } else {
        sigDisplay.innerHTML = 'WAIT';
        sigDisplay.classList.add('signal-wait');
        lastSignalState = 'WAIT';
      }

      document.getElementById('confDisplay').innerText = pair.confidence + '%';
      document.getElementById('rsiDisplay').innerText = pair.rsi;
    }

    window.onload = () => {
      updateModalList(null);
      connectWS();
    };
  </script>
</body>
</html>
