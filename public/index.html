<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI PRO SIGNAL - Smart Assistant</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #060a12; color: #ffffff; padding: 16px; display: flex; flex-direction: column; gap: 12px; height: 100vh; justify-content: center; }
    
    .header { text-align: center; padding: 6px; font-weight: 900; font-size: 18px; color: #38bdf8; display: flex; align-items: center; justify-content: center; gap: 8px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    
    .status-badge { font-size: 10px; padding: 3px 10px; border-radius: 12px; font-weight: 900; }
    .status-online { background: #059669; color: #ffffff; border: 1px solid #34d399; box-shadow: 0 0 8px rgba(52, 211, 153, 0.8); animation: pulse 1.2s infinite; }
    .status-offline { background: #dc2626; color: #ffffff; border: 1px solid #fca5a5; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    .controls-card { background: #0f172a; border-radius: 12px; padding: 12px; display: flex; gap: 10px; border: 1px solid #1e293b; }
    .select-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .select-group label { font-size: 11px; color: #38bdf8; font-weight: bold; }
    select { background: #060a12; color: #ffffff; border: 1.5px solid #0284c7; padding: 8px; border-radius: 8px; font-size: 13px; outline: none; font-weight: bold; }

    .signal-card { background: #0f172a; border-radius: 16px; padding: 20px; text-align: center; border: 1px solid #1e293b; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7); }
    .pair-title { font-size: 14px; color: #94a3b8; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    
    .signal-box { 
      font-size: 42px; 
      font-weight: 900; 
      padding: 18px; 
      border-radius: 14px; 
      text-transform: uppercase; 
      letter-spacing: 3px; 
      transition: all 0.2s ease-in-out; 
    }
    
    /* 💥 ส้มอำพัน Amber Gold Neon */
    .WAIT { background: #c2410c; color: #ffffff; border: 3px solid #ff781f; box-shadow: 0 0 25px rgba(255, 120, 31, 0.75); text-shadow: 0 0 12px rgba(255, 255, 255, 0.9); }
    /* 🟢 เขียวนีออนสด */
    .CALL { background: #047857; color: #ffffff; border: 3px solid #10b981; box-shadow: 0 0 32px rgba(16, 185, 129, 0.9); text-shadow: 0 0 12px rgba(255, 255, 255, 0.9); }
    /* 🔴 แดงนีออนสด */
    .PUT { background: #be123c; color: #ffffff; border: 3px solid #f43f5e; box-shadow: 0 0 32px rgba(244, 63, 94, 0.9); text-shadow: 0 0 12px rgba(255, 255, 255, 0.9); }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-box { background: #060a12; border-radius: 10px; padding: 10px; text-align: center; border: 1px solid #1e293b; }
    .stat-label { font-size: 10px; color: #64748b; font-weight: 700; }
    .stat-value { font-size: 16px; font-weight: 900; margin-top: 4px; color: #ffffff; }
  </style>
</head>
<body>

  <div class="header">
    ⚡ AI PRO SIGNAL <span id="netStatus" class="status-badge status-offline">● OFFLINE</span>
  </div>

  <div class="controls-card">
    <div class="select-group">
      <label>คู่เงิน (IQ Option)</label>
      <select id="assetSelect" onchange="changeMarket()">
        <option value="EURUSD">EUR/USD</option>
        <option value="GBPUSD">GBP/USD</option>
        <option value="USDJPY">USD/JPY</option>
        <option value="AUDUSD">AUD/USD</option>
        <option value="BTCUSD">BTC/USD (Crypto)</option>
      </select>
    </div>
    <div class="select-group">
      <label>กรอบเวลา (Timeframe)</label>
      <select id="tfSelect" onchange="changeMarket()">
        <option value="1m">1 นาที (1M)</option>
        <option value="5m">5 นาที (5M)</option>
      </select>
    </div>
  </div>

  <div class="signal-card">
    <div class="pair-title">
      <span id="marketLabel">EUR/USD (1M)</span>
      <span id="trendLabel" style="color: #38bdf8; font-size: 11px;">BULLISH 🟢</span>
    </div>

    <div id="signalDisplay" class="signal-box WAIT">WAIT</div>
    
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Confidence</div>
        <div class="stat-value" id="confValue" style="color: #38bdf8;">0.0%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">RSI (14)</div>
        <div class="stat-value" id="rsiValue" style="color: #facc15;">50.0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">แท่งถัดไปใน</div>
        <div class="stat-value" id="timerValue" style="color: #38bdf8;">00s</div>
      </div>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq = 600, duration = 0.15) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { console.log(e); }
    }

    let ws;
    let playedSound3 = false;
    let playedSound2 = false;

    function setNetStatus(isOnline) {
      const badge = document.getElementById('netStatus');
      if (isOnline) {
        badge.innerText = '● LIVE';
        badge.className = 'status-badge status-online';
      } else {
        badge.innerText = '● DISCONNECTED';
        badge.className = 'status-badge status-offline';
      }
    }

    function connectWS() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}`);

      ws.onopen = () => setNetStatus(true);

      ws.onmessage = (event) => {
        setNetStatus(true);
        const data = JSON.parse(event.data);
        if (data.type === 'market_update') {
          const timeLeft = data.timeLeft;

          if (timeLeft === 3 && !playedSound3) {
            playBeep(600, 0.12);
            playedSound3 = true;
          }
          if (timeLeft === 2 && !playedSound2) {
            playBeep(900, 0.18);
            playedSound2 = true;
          }
          if (timeLeft > 3) {
            playedSound3 = false;
            playedSound2 = false;
          }

          document.getElementById('signalDisplay').innerText = data.signal;
          document.getElementById('signalDisplay').className = `signal-box ${data.signal}`;
          document.getElementById('confValue').innerText = `${data.confidence}%`;
          document.getElementById('rsiValue').innerText = data.rsi;
          document.getElementById('trendLabel').innerText = data.trend;
          document.getElementById('timerValue').innerText = `${timeLeft}s`;
        }
      };

      ws.onclose = () => {
        setNetStatus(false);
        setTimeout(connectWS, 2000);
      };

      ws.onerror = () => setNetStatus(false);
    }

    function changeMarket() {
      const symbol = document.getElementById('assetSelect').value;
      const tf = document.getElementById('tfSelect').value;
      document.getElementById('marketLabel').innerText = `${symbol} (${tf.toUpperCase()})`;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'subscribe', symbol, tf }));
      }
    }

    window.addEventListener('online', () => setNetStatus(true));
    window.addEventListener('offline', () => setNetStatus(false));

    connectWS();
  </script>
</body>
</html>
