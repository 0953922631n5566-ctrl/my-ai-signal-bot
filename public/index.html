<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI Trading Assistant</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 16px; display: flex; flex-direction: column; gap: 14px; height: 100vh; justify-content: center; }
    
    .header { text-align: center; padding: 8px; font-weight: bold; font-size: 18px; color: #38bdf8; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .status-badge { font-size: 11px; background: #064e3b; color: #34d399; padding: 3px 10px; border-radius: 12px; border: 1px solid #059669; }

    /* Controls Section */
    .controls-card { background: #1e293b; border-radius: 14px; padding: 12px; display: flex; gap: 10px; border: 1px solid #334155; }
    .select-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .select-group label { font-size: 11px; color: #94a3b8; }
    select { background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 10px; border-radius: 8px; font-size: 14px; outline: none; font-weight: bold; }

    /* Signal Card */
    .signal-card { background: #1e293b; border-radius: 14px; padding: 20px; text-align: center; border: 1px solid #334155; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
    .pair-title { font-size: 14px; color: #94a3b8; font-weight: 500; }
    .signal-box { font-size: 38px; font-weight: 900; padding: 18px; border-radius: 12px; text-transform: uppercase; letter-spacing: 2px; }
    
    .WAIT { background: #334155; color: #f1f5f9; border: 2px solid #64748b; }
    .CALL { background: #065f46; color: #34d399; border: 2px solid #10b981; text-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
    .PUT { background: #831843; color: #f43f5e; border: 2px solid #f43f5e; text-shadow: 0 0 10px rgba(244, 63, 94, 0.4); }

    /* Indicators Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-box { background: #0f172a; border-radius: 10px; padding: 10px; text-align: center; border: 1px solid #334155; }
    .stat-label { font-size: 11px; color: #94a3b8; }
    .stat-value { font-size: 16px; font-weight: bold; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="header">
    🤖 AI Signal Assistant <span class="status-badge">● LIVE</span>
  </div>

  <div class="controls-card">
    <div class="select-group">
      <label>คู่เงิน (IQ Option)</label>
      <select id="assetSelect" onchange="changeMarket()">
        <option value="EURUSD">EUR/USD</option>
        <option value="GBPUSD">GBP/USD</option>
        <option value="USDJPY">USD/JPY</option>
        <option value="AUDUSD">AUD/USD</option>
        <option value="BTCUSD">BTC/USD (Crypto)</option>
      </select>
    </div>
    <div class="select-group">
      <label>กรอบเวลา (Timeframe)</label>
      <select id="tfSelect" onchange="changeMarket()">
        <option value="1m">1 นาที (1M)</option>
        <option value="5m">5 นาที (5M)</option>
      </select>
    </div>
  </div>

  <div class="signal-card">
    <div class="pair-title" id="marketLabel">EUR/USD (1M)</div>
    <div id="signalDisplay" class="signal-box WAIT">WAIT</div>
    
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Confidence</div>
        <div class="stat-value" id="confValue">0.0%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">RSI (14)</div>
        <div class="stat-value" id="rsiValue">50.0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">แท่งถัดไปใน</div>
        <div class="stat-value" id="timerValue" style="color: #38bdf8;">00s</div>
      </div>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    let ws;
    function connectWS() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}`);

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'market_update') {
          document.getElementById('signalDisplay').innerText = data.signal;
          document.getElementById('signalDisplay').className = `signal-box ${data.signal}`;
          document.getElementById('confValue').innerText = `${data.confidence}%`;
          document.getElementById('rsiValue').innerText = data.rsi;
          document.getElementById('timerValue').innerText = `${data.timeLeft}s`;
        }
      };

      ws.onclose = () => setTimeout(connectWS, 2000);
    }

    function changeMarket() {
      const symbol = document.getElementById('assetSelect').value;
      const tf = document.getElementById('tfSelect').value;
      document.getElementById('marketLabel').innerText = `${symbol} (${tf.toUpperCase()})`;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'subscribe', symbol, tf }));
      }
    }

    connectWS();
  </script>
</body>
</html>
