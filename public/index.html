<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI AUTO SCANNER PRO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { 
      background: radial-gradient(circle at center, #0a1128 0%, #030712 100%); 
      color: #ffffff; 
      padding: 12px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      height: 100vh; 
      overflow: hidden; 
    }
    
    .top-container { display: flex; flex-direction: column; gap: 10px; }

    /* ⚡ ส่วนหัวธีม Sci-Fi */
    .header-box { 
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.8)); 
      border: 1.5px solid #00f2fe; 
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.2); 
      border-radius: 14px; 
      padding: 10px 14px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
    }
    .header-title { font-size: 16px; font-weight: 900; color: #00f2fe; letter-spacing: 1px; text-shadow: 0 0 8px rgba(0,242,254,0.6); }
    .header-sub { font-size: 10px; color: #94a3b8; }
    
    .status-pill { 
      background: rgba(5, 150, 105, 0.2); 
      color: #34d399; 
      border: 1px solid #10b981; 
      font-size: 10px; 
      padding: 4px 10px; 
      border-radius: 20px; 
      font-weight: 900; 
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); 
      animation: pulseLive 1.5s infinite; 
    }
    @keyframes pulseLive { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    /* แบนเนอร์แจ้งสถานะสแกน */
    .scanner-banner { 
      background: linear-gradient(90deg, rgba(2, 132, 199, 0.15), rgba(0, 242, 254, 0.1)); 
      border: 1px solid #0284c7; 
      border-radius: 10px; 
      padding: 8px 12px; 
      text-align: center; 
      color: #38bdf8; 
      font-weight: bold; 
      font-size: 11px; 
      box-shadow: inset 0 0 10px rgba(2,132,199,0.2); 
    }

    /* 🛡️ การ์ดสัญญาณหลักล้ำๆ */
    .signal-card { 
      background: linear-gradient(180deg, #0f172a 0%, #060a12 100%); 
      border-radius: 18px; 
      padding: 16px; 
      text-align: center; 
      border: 1.5px solid #00d2ff; 
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.25), inset 0 0 15px rgba(0, 210, 255, 0.1); 
      display: flex; 
      flex-direction: column; 
      gap: 14px; 
    }
    
    .pair-title { font-size: 13px; color: #94a3b8; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .pair-highlight { color: #facc15; font-size: 15px; font-weight: 900; text-shadow: 0 0 8px rgba(250,204,21,0.4); }

    /* วงกลมเรืองแสงตรงกลางสำหรับโชว์ WAIT / CALL / PUT */
    .circle-display-wrapper {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .signal-circle { 
      width: 150px;
      height: 150px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 32px; 
      font-weight: 900; 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      transition: all 0.3s ease;
      position: relative;
      z-index: 2;
    }

    /* เอฟเฟกต์วงแหวนเรืองแสงชั้นนอก */
    .circle-display-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px dashed rgba(0, 242, 254, 0.4);
      animation: rotateRing 15s linear infinite;
    }
    @keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* สเตทสีต่างๆ ของวงกลม */
    .WAIT { background: rgba(30, 41, 59, 0.9); color: #94a3b8; border: 3px solid #334155; box-shadow: 0 0 20px rgba(51, 65, 85, 0.5); }
    .CALL { background: rgba(4, 120, 87, 0.9); color: #ffffff; border: 3px solid #10b981; box-shadow: 0 0 40px rgba(16, 185, 129, 0.9); }
    .PUT { background: rgba(190, 18, 60, 0.9); color: #ffffff; border: 3px solid #f43f5e; box-shadow: 0 0 40px rgba(244, 63, 94, 0.9); }
    .SIDEWAY { background: rgba(127, 29, 29, 0.9); color: #fef08a; border: 3px solid #ef4444; animation: alertBlink 0.6s infinite alternate; }

    @keyframes alertBlink {
      from { background: #7f1d1d; box-shadow: 0 0 15px #ef4444; }
      to { background: #b91c1c; box-shadow: 0 0 35px #f87171; }
    }

    /* กล่องสถิติด้านล่าง */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-box { background: rgba(6, 10, 18, 0.8); border-radius: 10px; padding: 10px 6px; text-align: center; border: 1px solid #1e293b; }
    .stat-label { font-size: 9px; color: #64748b; font-weight: 700; text-transform: uppercase; }
    .stat-value { font-size: 15px; font-weight: 900; margin-top: 4px; color: #ffffff; }
    
    .progress-bar { width: 100%; height: 3px; background: #1e293b; border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .progress-fill { height: 100%; background: #00f2fe; width: 70%; box-shadow: 0 0 6px #00f2fe; }

    /* 🧭 แถบเมนูด้านล่างสุด (Bottom Navigation Bar) */
    .bottom-nav { 
      background: rgba(15, 23, 42, 0.95); 
      border-top: 1px solid #1e293b; 
      border-radius: 14px 14px 0 0; 
      padding: 8px 10px; 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 4px; 
      text-align: center; 
    }
    .nav-item { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 3px; 
      color: #64748b; 
      font-size: 10px; 
      font-weight: bold; 
      cursor: pointer; 
      padding: 4px; 
      border-radius: 8px; 
      transition: 0.2s; 
    }
    .nav-item.active { color: #00f2fe; background: rgba(0, 242, 254, 0.1); text-shadow: 0 0 6px rgba(0,242,254,0.5); }
    .nav-icon { font-size: 16px; }
  </style>
</head>
<body>

  <div class="top-container">
    <!-- ส่วนหัว -->
    <div class="header-box">
      <div>
        <div class="header-title">⚡ AI AUTO SCANNER</div>
        <div class="header-sub">วิเคราะห์แม่นยำ ส่งสัญญาณเร็วด้วย AI</div>
      </div>
      <div id="netStatus" class="status-pill">LIVE</div>
    </div>

    <!-- แบนเนอร์สถานะ -->
    <div class="scanner-banner">
      🔍 ระบบกำลังสแกนหาคู่เงินที่มีความแม่นยำสูง (≥ 68%) อัตโนมัติ...
    </div>

    <!-- การ์ดสัญญาณหลัก -->
    <div class="signal-card">
      <div class="pair-title">
        <span>AI Selected: <strong id="marketLabel" class="pair-highlight">EUR/USD</strong></span>
        <span id="trendLabel" style="color: #38bdf8; font-size: 11px; font-weight: bold;">TRIPLE EMA ACTIVE 🟢</span>
      </div>

      <!-- วงกลมเรืองแสงแสดงสัญญาณ -->
      <div class="circle-display-wrapper">
        <div id="signalDisplay" class="signal-circle WAIT">WAIT</div>
      </div>
      
      <!-- สถิติย่อย 3 ช่อง -->
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Confidence</div>
          <div class="stat-value" id="confValue" style="color: #00f2fe;">0.0%</div>
          <div class="progress-bar"><div class="progress-fill" id="confBar" style="width: 0%;"></div></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">RSI (14)</div>
          <div class="stat-value" id="rsiValue" style="color: #facc15;">50.0</div>
          <div class="progress-bar"><div class="progress-fill" style="width: 50%; background: #facc15;"></div></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">แท่งถัดไปใน</div>
          <div class="stat-value" id="timerValue" style="color: #ff007f;">00s</div>
          <div class="progress-bar"><div class="progress-fill" style="width: 100%; background: #ff007f;"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- เมนูด้านล่างสุด (Bottom Nav Bar) -->
  <div class="bottom-nav">
    <div class="nav-item" onclick="alert('ระบบสแกนหลายคู่ทำงานอัตโนมัติเบื้องหลังแล้วครับ')">
      <span class="nav-icon">🎯</span>
      <span>เลือกคู่เงิน</span>
    </div>
    <div class="nav-item" onclick="alert('กรอบเวลาล็อกไว้ที่ 1 นาที (1M) เพื่อความแม่นยำสูงสุด')">
      <span class="nav-icon">⏱️</span>
      <span>เลือกเวลา</span>
    </div>
    <div class="nav-item active">
      <span class="nav-icon">⚡</span>
      <span>AI สแกน</span>
    </div>
    <div class="nav-item" onclick="alert('ระบบใช้ Triple EMA (5, 20, 50) + กรองไซด์เวย์อัตโนมัติ')">
      <span class="nav-icon">⚙️</span>
      <span>ตั้งค่า</span>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 800, duration = 0.25) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    let ws;
    let lastSignalState = 'WAIT';
    let warned10s = false;

    function connectWS() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}`);

      ws.onopen = () => {
        const badge = document.getElementById('netStatus');
        badge.innerText = 'LIVE';
        badge.style.background = 'rgba(5, 150, 105, 0.2)';
        badge.style.color = '#34d399';
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'market_update') {
          const timeLeft = data.timeLeft;

          if (timeLeft === 10 && !warned10s) {
            playBeep(550, 0.15);
            warned10s = true;
          }
          if (timeLeft > 10) warned10s = false;

          if (data.signal !== 'WAIT' && lastSignalState === 'WAIT') {
            playBeep(850, 0.3);
          }
          lastSignalState = data.signal;

          document.getElementById('marketLabel').innerText = data.symbol || 'EUR/USD';
          
          const sigBox = document.getElementById('signalDisplay');
          sigBox.innerText = data.signal;
          sigBox.className = `signal-circle ${data.signal}`;

          document.getElementById('confValue').innerText = `${data.confidence}%`;
          document.getElementById('confBar').style.width = `${data.confidence}%`;
          
          document.getElementById('rsiValue').innerText = data.rsi;
          document.getElementById('trendLabel').innerText = data.trend;
          document.getElementById('timerValue').innerText = `${timeLeft}s`;
        }
      };

      ws.onclose = () => {
        const badge = document.getElementById('netStatus');
        badge.innerText = 'OFFLINE';
        badge.style.background = 'rgba(220, 38, 38, 0.2)';
        badge.style.color = '#fca5a5';
        setTimeout(connectWS, 2000);
      };
    }

    connectWS();
  </script>
</body>
</html>
