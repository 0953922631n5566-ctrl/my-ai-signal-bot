name: Build Clean Android OCR APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-radar-clean/**'
      - '.github/workflows/build-android-clean.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        working-directory: android-radar-clean
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build clean debug APK
        working-directory: android-radar-clean
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload clean APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Signal-Radar-OCR-Clean-debug
          path: android-radar-clean/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
