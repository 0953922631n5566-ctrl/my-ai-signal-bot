services:
  - type: web
    name: ai-signal-radar
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: POLL_INTERVAL_MS
        value: "60000"
