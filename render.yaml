services:
  - type: web
    name: ai-real-time-signal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TWELVE_DATA_API_KEY
        value: "ใส่ API Key ของลูกพี่ตรงนี้"
