services:
  - type: web
    name: ai-signal-radar
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: FOREX_PAIRS
        value: "EUR/USD,GBP/USD,USD/JPY"
      - key: MIN_SIGNAL_SCORE
        value: "68"
      - key: MAX_DATA_AGE_SECONDS
        value: "180"