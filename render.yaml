services:
  - type: web
    name: ai-signal-radar
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: FOREX_PAIR
        value: EUR/USD
      - key: POLL_INTERVAL_MS
        value: "60000"
      - key: MIN_SIGNAL_SCORE
        value: "68"
      - key: SCREEN_INGEST_TOKEN
        sync: false
      - key: PORT
        value: "10000"