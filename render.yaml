
services:
  - type: web
    name: ai-signal-radar
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: REQUIRE_TELEGRAM_AUTH
        value: "true"
      - key: MAX_API_CALLS_PER_DAY
        value: "700"
      - key: MIN_SIGNAL_SCORE
        value: "68"
      - key: SIGNAL_HOLD_SECONDS
        value: "40"
